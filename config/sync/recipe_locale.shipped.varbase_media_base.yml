  -
    name: eca.eca.define_breakpoints
    data:
      third_party_settings:
        modeler_api:
          label: 'Define custom breakpoints'
          documentation: 'Defines custom breakpoints for responsive images.'
      events:
        eca_render__breakpoints_alter_1ni95xs:
          label: 'Alter breakpoint'
      actions:
        eca_render_alter_breakpoint_1ic6gni:
          label: 'Define small breakpoint'
          configuration:
            definition: |-
              label: Small
              mediaQuery: 'all and (min-width: 500px)'
              weight: 0
              multipliers:
                - 1x
              group: custom
        eca_render_alter_breakpoint_176hkyu:
          label: 'Define medium breakpoint'
          configuration:
            definition: |-
              label: Medium
              mediaQuery: 'all and (min-width: 700px)'
              weight: 1
              multipliers:
                - 1x
              group: custom
        eca_render_alter_breakpoint_1k0stlk:
          label: 'Define large breakpoint'
          configuration:
            definition: |-
              label: Large
              mediaQuery: 'all and (min-width: 1000px)'
              weight: 2
              multipliers:
                - 1x
              group: custom
        eca_render_alter_breakpoint_1e7fgzt:
          label: 'Define x-large breakpoint'
          configuration:
            definition: |-
              label: X-Large
              mediaQuery: 'all and (min-width: 1300px)'
              weight: 3
              multipliers:
                - 1x
              group: custom
  -
    name: eca.eca.grant_media_type_permissions
    data:
      third_party_settings:
        modeler_api:
          label: 'Grant media type permissions'
          documentation: 'When a new media type is created, permissions to work with it are automatically granted to content editors.'
      events:
        config__save_1_1:
          label: 'Media type created'
      actions:
        eca_config_action_1p0ypjk:
          label: 'Grant permissions'
          configuration:
            data: '["create [config:id] media", "delete any [config:id] media", "edit any [config:id] media", "use media [config:id] bulk upload form"]'
        eca_switch_account_0dshb6m:
          label: 'Temporarily become administrator'
  -
    name: eca.eca.remote_video_consent
    data:
      third_party_settings:
        modeler_api:
          label: 'Enable consent management for remote video'
      events:
        content_entity__insert_video:
          label: 'Insert remote video'
        config__save_config:
          label: 'Save config'
      conditions:
        eca_scalar_is_2:
          configuration:
            left: '[config_name]'
            right: klaro.klaro_app.youtube
        eca_scalar_is_1:
          configuration:
            left: '[config_name]'
            right: klaro.klaro_app.vimeo
        eca_scalar_vimeo_1:
          configuration:
            left: '[media:field_media_oembed_video]'
            right: vimeo.com
        eca_scalar_disabled:
          configuration:
            left: '[status]'
            right: '1'
        eca_scalar_1:
          configuration:
            left: '[config:status]'
            right: '1'
        eca_scalar_enabled:
          configuration:
            left: '[config_original:status]'
            right: '1'
      actions:
        eca_token_set_value_1:
          label: 'Set default provider to YouTube'
          configuration:
            token_value: youtube
        eca_token_set_value_provider_1:
          label: 'Set provider to Vimeo'
          configuration:
            token_value: vimeo
        eca_config_read_1:
          label: 'Read current setting'
        eca_config_write_1:
          label: 'Enable provider'
          configuration:
            config_value: '1'
        eca_switch_account_1:
          label: 'Switch user account'
        eca_void_and_condition_1:
          label: AND
        eca_void_and_condition_2:
          label: AND
        eca_config_write_provider:
          label: 'Re-enable provider'
          configuration:
            config_value: '1'
        eca_switch_account__1:
          label: 'Switch user'
        eca_token_load_entity_0rno7mm_1:
          label: 'Load a remote video'
          configuration:
            properties: 'bundle: remote_video'
  -
    name: field.field.media.remote_audio.field_media_oembed_audio
    data:
      label: 'Audio URL'
      description: 'The address of the episode on SoundCloud, Spotify, Apple Podcasts or another supported service.'
