  -
    name: field.field.node.podcast_episode.field_duration
    data:
      label: Duration
      description: 'Running time as it should read to a listener, for example 42:15.'
  -
    name: field.field.node.podcast_episode.field_episode_number
    data:
      label: 'Episode number'
      description: 'The episode number within the show.'
  -
    name: field.field.node.podcast_episode.field_featured_image
    data:
      label: 'Cover art'
      description: 'The episode cover image, square where possible. Shown on the podcast card and at the top of the episode page.'
