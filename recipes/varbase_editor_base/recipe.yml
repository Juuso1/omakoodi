name: Varbase Editor Base
description: A recipe to manage default installed modules, configs and permissions for Varbase editor functionality including CKEditor 5 with rich text editing capabilities.
type: Varbase Editor
install:
  - anchor_link
  - ace_editor
  - ckeditor_bidi
  - entity_embed
  - extlink
  - editor_advanced_link
  - ckeditor_media_embed
  - ckeditor_media_resize
  - edit_media_modal
  - linkit
  - pathologic
  - token
  - token_filter
  - ckeditor5_paste_filter
  - ckeditor5_plugin_pack
  - ckeditor5_plugin_pack_find_and_replace
  - ckeditor5_premium_features
  - ckeditor5_premium_features_fullscreen
  - ckeditor5_premium_features_wproofreader
  - ckeditor5_plugin_pack_free_wproofreader
  - ckeditor_emoji
  # The text formats and the Linkit profile drupal_cms_content_type_base used
  # to provide, and the roles below are granted. That recipe was removed from
  # Drupal CMS 2.2 and its last release requires Tagify 1, which no longer
  # installs beside Drupal CMS.
  - ckeditor5
  - editor
  - filter
  - media
config:
  import:
    linkit:
      - image.style.linkit_result_thumbnail
    ace_editor: '*'
    pathologic: '*'
    editor_advanced_link: '*'
    ckeditor_media_embed: '*'
    ckeditor_media_resize: '*'
    edit_media_modal: '*'
    ckeditor5_paste_filter: '*'
    extlink: '*'
  actions:
    extlink.settings:
      simpleConfigUpdate:
        extlink_use_external_js_file: false
        extlink_exclude_admin_routes: false
        extlink_target: true
        extlink_target_no_override: false
        extlink_target_display_default_title: true
        extlink_target_default_title_text: '(opens in a new window)'
        extlink_title_no_override: false
        extlink_nofollow: false
        extlink_noreferrer: true
        extlink_follow_no_override: false
        extlink_subdomains: true
        extlink_alert: false
        extlink_alert_text: ''
        extlink_hide_icons: false
        extlink_additional_link_classes: ''
        extlink_additional_mailto_classes: ''
        extlink_additional_tel_classes: ''
        extlink_exclude: ''
        extlink_include: ''
        extlink_exclude_noreferrer: ''
        extlink_class: '0'
        extlink_label: '(opens in new window)'
        extlink_img_class: false
        extlink_css_exclude: ''
        extlink_css_include: ''
        extlink_css_explicit: ''
        extlink_mailto_class: mailto
        extlink_mailto_label: '(link sends email)'
        extlink_tel_class: tel
        extlink_tel_label: '(link is a phone number)'
        extlink_use_font_awesome: false
        extlink_font_awesome_classes:
          links: 'fa fa-external-link'
          mailto: 'fa fa-envelope-o'
          tel: 'fa fa-phone'
        extlink_icon_placement: append
        extlink_prevent_orphan: true
        allowed_domains: {  }
    pathologic.settings:
      simpleConfigUpdate:
        protocol_style: 'path'
    user.role.content_editor:
      grantPermissions:
        - 'use text format canvas_html_inline'
        - 'use text format content_format'
        - 'use text format full_html'
    user.role.content_admin:
      grantPermissions:
        - 'use text format canvas_html_inline'
        - 'use text format content_format'
        - 'use text format full_html'
    user.role.seo_admin:
      grantPermissions:
        - 'use text format canvas_html_inline'
        - 'use text format content_format'
        - 'use text format full_html'
    user.role.site_admin:
      grantPermissions:
        - 'use text format canvas_html_block'
        - 'use text format canvas_html_inline'
        - 'use text format content_format'
        - 'use text format easy_email'
        - 'use text format full_html'
