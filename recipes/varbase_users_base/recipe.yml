name: 'Varbase Users Base'
type: 'User roles'
description: 'A recipe to manage default Varbase user roles and user management configurations, including role definitions, account settings, and the modules needed to support user management on the site.'
install:
  - node
  - block
  - persistent_login
  - eca
  - eca_base
  - eca_render
  - eca_user
  - modeler_api
config:
  # If the roles already exist, we don't really care what they look like.
  strict: false
  actions:
    user.settings:
      simpleConfigUpdate:
        anonymous: Anonymous
        verify_mail: false
        notify:
          cancel_confirm: true
          password_reset: true
          status_activated: true
          status_blocked: false
          status_canceled: false
          register_admin_created: true
          register_no_approval_required: true
          register_pending_approval: true
        register: admin_only
        cancel_method: user_cancel_block
        password_reset_timeout: 86400
        password_strength: true
        langcode: en
