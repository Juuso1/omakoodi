name: Varbase Security Base
description: A recipe to manage default security configurations including password policy, username enumeration prevention, security kit, CAPTCHA, honeypot, antibot, and flood control.
type: Varbase Security
install:
  - captcha
  - recaptcha
  - honeypot
  - antibot
  - password_policy
  - password_policy_character_types
  - password_policy_characters
  - password_policy_history
  - password_policy_length
  - password_policy_username
  - seckit
  - username_enumeration_prevention
  - flood_control
  # Consent management, which drupal_cms_privacy_basic used to set up. That
  # recipe was removed from Drupal CMS 2.2 and its last release requires
  # Tagify 1, which no longer installs beside Drupal CMS.
  - klaro
  - menu_link_content
  - eca_base
  - eca_config
  - eca_content
  - eca_user
  - modeler_api
config:
  import:
    captcha: '*'
    recaptcha: '*'
    honeypot: '*'
    antibot: '*'
    password_policy: '*'
    seckit: '*'
    flood_control: '*'
    klaro: '*'
    system:
      - system.menu.footer
  actions:
    klaro.settings:
      simpleConfigUpdate:
        auto_decorate_final_html: true
        library.group_by_purpose: true
    klaro.texts:
      simpleConfigUpdate:
        consentModal.privacyPolicy.url: 'internal:/privacy-policy'
    klaro.klaro_app.cms:
      simpleConfigUpdate:
        label: 'Drupal CMS'
    # Remote videos ask for consent through the remote_video_consent ECA model
    # in varbase_media_base, so their Klaro apps stay off.
    klaro.klaro_app.vimeo:
      disable: []
    klaro.klaro_app.youtube:
      disable: []
    user.flood:
      simpleConfigUpdate:
        uid_only: false
        ip_limit: 5
        ip_window: 1800
        user_limit: 4
        user_window: 1800
    user.role.anonymous:
      grantPermissions:
        - 'use klaro'
    user.role.authenticated:
      grantPermissions:
        - 'bypass honeypot protection'
        - 'skip CAPTCHA'
        - 'use klaro'
    user.role.content_editor:
      grantPermissions:
        - 'skip antibot'
    user.role.content_admin:
      grantPermissions:
        - 'skip antibot'
    user.role.seo_admin:
      grantPermissions:
        - 'skip antibot'
    user.role.site_admin:
      grantPermissions:
        - 'administer flood unblock'
        - 'flood unblock ips'
        - 'skip antibot'
